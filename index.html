<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5bbd" />
    <meta
      name="description"
      content="Weatherly - live weather, hourly and 7-day forecasts, air quality and alerts for any city."
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- iOS home-screen app: full screen, content under a translucent status bar (safe areas are padded) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weatherly" />
    
    <title>Weatherly | Live Forecast</title>

    <!-- Start in the colours of the last forecast (saved by the app), so the status bar doesn't flash blue on launch -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('weatherly:sky'));
        var hex = /^#[0-9a-f]{6}$/i;
        if (s && hex.test(s.top) && hex.test(s.bottom)) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', s.top);
          document.documentElement.style.setProperty('--sky-top-color', s.top);
          document.documentElement.style.setProperty('--sky-bottom-color', s.bottom);
        }
      } catch (e) {}
    </script>
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://weatherly.balavardhan.dev/">
    <meta property="og:title" content="Weatherly | Live Forecast">
    <meta property="og:description" content="Live weather, hourly and 7-day forecasts, air quality and alerts for any city.">
    <meta property="og:image" content="https://weatherly.balavardhan.dev/logo.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://weatherly.balavardhan.dev/">
    <meta name="twitter:title" content="Weatherly | Live Forecast">
    <meta name="twitter:description" content="Live weather, hourly and 7-day forecasts, air quality and alerts for any city.">
    <meta name="twitter:image" content="https://weatherly.balavardhan.dev/logo.png">

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
